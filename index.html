<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reto Smoke Killer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--ink:#16211C;--muted:#4A5A51;--bg:#F4F7F5;--card:#FFFFFF;--line:#D5DED8;--green:#2F9E5B;--green-d:#1F6B3E;--blue:#2B7BD6;--red:#C8443E;--amber:#E0A23A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 28px;background:var(--ink);color:#fff}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;margin-right:8px}
.brand b{color:#4FE08F}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
nav button{background:transparent;color:#C9D6CE;border:1px solid transparent;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;min-height:44px}
nav button[aria-current="step"]{background:#fff;color:var(--ink)}
nav button:hover{border-color:#5E7468}
.score-strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#24332B;font-weight:600;font-size:15px}
.chip .dot{width:12px;height:12px;border-radius:6px}
.chip .pts{font-family:'Space Grotesk',sans-serif;font-size:20px}
main{flex:1 1 auto;width:100%;max-width:1280px;margin:0 auto;padding:40px 28px 48px}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d)}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(44px,6vw,84px);line-height:1;margin:12px 0 0;letter-spacing:-.01em}
h1 b{color:var(--green)}
h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,4vw,54px);line-height:1.08;margin:12px 0 0}
.lead{font-size:clamp(20px,2vw,26px);line-height:1.45;color:var(--muted);max-width:900px;margin:18px 0 0}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;min-height:52px;background:var(--ink);color:#fff}
.btn:hover{background:#2C3D34}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.team-in{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.team-in input{flex:1;border:none;font:600 20px Inter,sans-serif;color:var(--ink);background:transparent;min-width:0;padding:6px 0}
.team-in input:focus{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}
.sw{width:22px;height:22px;border-radius:11px;flex:0 0 22px}
.big-q{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,3.6vw,50px);line-height:1.15;margin:18px 0 0;max-width:1100px}
.counter{display:flex;align-items:center;gap:18px;margin-top:28px}
.counter .n{font-family:'Space Grotesk',sans-serif;font-size:72px;min-width:120px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:28px}
.opt{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:18px;background:#fff;border:2px solid var(--line);font-size:clamp(20px,2vw,26px);font-weight:600;text-align:left;color:var(--ink)}
.opt .l{flex:0 0 52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:26px;color:#fff}
.opt.right{border-color:var(--green);background:#E6F4EC}
.opt.dim{opacity:.4}
.explain{margin-top:22px;padding:22px 26px;border-radius:18px;background:#E8F1FB;color:#163A60;font-size:21px;line-height:1.5}
.explain .src{display:block;margin-top:8px;font-size:15px;color:#3C5A7A}
.award{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.award .tag{font-weight:700;font-size:17px;margin-right:6px}
.tbtn{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;min-height:48px;color:var(--ink)}
.tbtn[aria-pressed="true"]{border-color:var(--green);background:#E6F4EC}
.timer{font-family:'Space Grotesk',sans-serif;font-size:44px;min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.progress{height:8px;border-radius:4px;background:#DDE5E0;margin-top:20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--green)}
.steps{counter-reset:s;list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;font-size:20px;line-height:1.45}
.steps li::before{content:counter(s);flex:0 0 36px;height:36px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif}
.mat{margin:12px 0 0;padding-left:22px;font-size:19px;line-height:1.6}
.colors{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;align-items:center;font-size:19px;font-weight:600}
.vial{width:46px;height:70px;border-radius:0 0 18px 18px;border:3px solid #9FB0A6;border-top:none}
.pledges{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.pl{display:grid;grid-template-columns:minmax(220px,340px) 1fr auto;gap:16px;align-items:center}
.pl .name{font-size:21px;font-weight:600}
.pl .bar{height:34px;border-radius:10px;background:#E3E9E5;overflow:hidden}
.pl .bar span{display:block;height:100%;background:var(--green);transition:width .3s}
.pl .ctr{display:flex;align-items:center;gap:8px}
.pl .ctr b{font-family:'Space Grotesk',sans-serif;font-size:26px;min-width:44px;text-align:center}
.sq{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:700;color:var(--ink)}
.podium{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px}
.pod{flex:1 1 200px;padding:22px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.pod.win{border-color:var(--green);background:#E6F4EC}
.pod .p{font-family:'Space Grotesk',sans-serif;font-size:56px;line-height:1}
.guide{margin-top:34px}
.guide summary{font-weight:700;font-size:18px;cursor:pointer;padding:8px 0;min-height:44px}
.guide table{border-collapse:collapse;width:100%;font-size:17px;margin-top:10px}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.foot{margin-top:24px;font-size:14px;color:var(--muted)}
.hidden{display:none !important}
.kbd{font-size:14px;color:var(--muted)}
@media (max-width:640px){.opts{grid-template-columns:1fr}.pl{grid-template-columns:1fr}main{padding:28px 18px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">RETO SMOKE <b>KILLER</b></div>
  <nav id="nav" aria-label="Secciones"></nav>
  <div class="score-strip" id="strip" aria-label="Puntaje"></div>
</header>
<main id="main"></main>
</div>

<script>
const TEAM_COLORS = ['#2F9E5B', '#2B7BD6', '#E0A23A', '#B5468C'];
const S = {
  view: 'inicio',
  teams: [{ name: 'Equipo Verde', pts: 0 }, { name: 'Equipo Azul', pts: 0 }, { name: 'Equipo Amarillo', pts: 0 }],
  r1: 0, hands: [0, 0, 0, 0],
  q: 0, revealed: false, awarded: {},
  timer: null, left: 20,
  exp: 0, expTimer: null, expLeft: 60,
  pledges: [0, 0, 0, 0, 0, 0],
};
const VIEWS = [['inicio', 'Inicio'], ['r1', '1 · ¿Y vos?'], ['r2', '2 · Trivia'], ['r3', '3 · Experimento'], ['final', 'Compromiso y ganador']];

const R1 = [
  'Levantá la mano si alguna vez tosiste por el humo de un bus o un carro.',
  'Levantá la mano si caminás o esperás el bus cerca de una calle con mucho tráfico.',
  'Levantá la mano si conocés a alguien con asma o alergias.',
  'Levantá la mano si alguna vez viste el cielo gris por el humo o la contaminación.',
];

const QS = [
  { q: '¿Qué gas se “comen” las microalgas del Smoke Killer?', o: ['Oxígeno', 'Dióxido de carbono (CO₂)', 'Nitrógeno', 'Helio'], a: 1,
    e: 'Las microalgas usan el CO₂ del aire para crecer, igual que las plantas. El carbono se queda en su cuerpo (la biomasa).' },
  { q: 'En la fotosíntesis, ¿de dónde sale el oxígeno que se libera?', o: ['Del CO₂', 'Del agua (H₂O)', 'Del sol', 'De los nutrientes'], a: 1,
    e: '¡La pregunta trampa! La luz rompe moléculas de agua: 2 H₂O → O₂ + 4 H⁺ + 4 e⁻. El oxígeno viene del agua, no del CO₂.' },
  { q: '¿Qué parte del Smoke Killer atrapa el hollín y el polvo del humo?', o: ['Las microalgas', 'El filtro', 'El panel solar', 'El tanque'], a: 1,
    e: 'Las algas se comen el CO₂, pero no el hollín. Por eso el aire pasa primero por un filtro que atrapa las partículas.' },
  { q: '¿Qué tan pequeña es una partícula PM2.5 comparada con el grosor de un pelo humano?', o: ['Del mismo tamaño', 'La mitad', 'Unas 30 veces más pequeña', 'Más grande que el pelo'], a: 2,
    e: 'Un pelo mide unos 70 micrómetros; una PM2.5 mide 2,5 o menos. Son tan pequeñas que llegan hasta lo más profundo de los pulmones.',
    s: 'Fuente: EPA (Agencia de Protección Ambiental de EE. UU.)' },
  { q: 'Según la OMS, ¿qué porcentaje de la población mundial respira aire que supera sus límites de calidad?', o: ['25 %', '50 %', '75 %', '99 %'], a: 3,
    e: 'Casi todo el mundo: el 99 % de la población respira aire que supera los límites recomendados por la OMS.',
    s: 'Fuente: Organización Mundial de la Salud, 2022' },
  { q: '¿Cuántas muertes al año relaciona la OMS con la contaminación del aire?', o: ['70 mil', '700 mil', '7 millones', '70 millones'], a: 2,
    e: 'La OMS calcula unos 7 millones de muertes prematuras al año por el aire contaminado, en la calle y dentro de las casas.',
    s: 'Fuente: Organización Mundial de la Salud' },
  { q: '¿Qué se hace con las algas que se cosechan del Smoke Killer?', o: ['Se tiran a la basura', 'Abono o biogás', 'Se queman', 'Se devuelven a la calle'], a: 1,
    e: 'La biomasa de algas sirve como abono para plantas o para producir biogás. Nada se desperdicia.' },
  { q: 'Por cada 1 kg de CO₂ que fijan las algas, ¿cuánto oxígeno liberan, más o menos?', o: ['Nada', 'Unos 0,73 kg', 'Unos 5 kg', 'Unos 100 kg'], a: 1,
    e: 'Por la ecuación de la fotosíntesis (6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂): 6 × 32 g de O₂ por cada 6 × 44 g de CO₂ ≈ 0,73.' },
];

const PLEDGES = ['Caminar, ir en bici o en bus cuando pueda', 'No quemar basura ni hojas', 'Sembrar y cuidar un árbol', 'Apagar el motor cuando el carro está parado', 'Compartir el carro (jalón) con otros', 'Contarle a mi familia lo que aprendí hoy'];

const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function go(v) { stopTimers(); S.view = v; render(); window.scrollTo(0, 0); }
function stopTimers() { clearInterval(S.timer); S.timer = null; clearInterval(S.expTimer); S.expTimer = null; }

function renderNav() {
  $('#nav').innerHTML = VIEWS.map(([k, l]) => `<button data-go="${k}" ${S.view === k ? 'aria-current="step"' : ''}>${l}</button>`).join('');
  $('#strip').innerHTML = S.teams.map((t, i) => `<span class="chip"><span class="dot" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)} <span class="pts">${t.pts}</span></span>`).join('');
}

function vInicio() {
  return `
  <div class="eyebrow">Dinámica con el público · 12 minutos</div>
  <h1>¿Qué tan limpio es el aire <b>que respirás?</b></h1>
  <p class="lead">Formen equipos. Vamos a jugar, adivinar y hacer un experimento en vivo para entender cómo funciona el Smoke Killer y por qué nos importa a todos.</p>
  <div class="teams">
    ${S.teams.map((t, i) => `<label class="team-in"><span class="sw" style="background:${TEAM_COLORS[i]}"></span><span class="hidden">Nombre del equipo ${i + 1}</span><input data-team="${i}" value="${esc(t.name)}" aria-label="Nombre del equipo ${i + 1}"></label>`).join('')}
  </div>
  <div class="row" style="margin-top:18px">
    <button class="btn ghost" data-act="addTeam" ${S.teams.length >= 4 ? 'disabled' : ''}>+ Agregar equipo</button>
    <button class="btn ghost" data-act="rmTeam" ${S.teams.length <= 2 ? 'disabled' : ''}>− Quitar equipo</button>
    <button class="btn green" data-go="r1">Empezar →</button>
  </div>
  <details class="guide card">
    <summary>Guía para el presentador</summary>
    <table>
      <tr><th>Parte</th><th>Tiempo</th><th>Qué hacer</th></tr>
      <tr><td>1 · ¿Y vos?</td><td>2 min</td><td>Leé cada frase en voz alta. Contá cuántas manos se levantan y anotalo con + / −. Cierra con el dato de la OMS.</td></tr>
      <tr><td>2 · Trivia</td><td>5 min</td><td>Cada equipo responde con los dedos (1, 2, 3 o 4). Usá el cronómetro, revelá la respuesta y marcá a los equipos que acertaron.</td></tr>
      <tr><td>3 · Experimento</td><td>3 min</td><td>Un voluntario por equipo sopla con una pajilla en el vaso con indicador. Todos ven cómo cambia de color. Leé la explicación.</td></tr>
      <tr><td>Compromiso</td><td>2 min</td><td>Cada persona elige una acción; contá las manos por opción. Termina anunciando al equipo ganador.</td></tr>
    </table>
    <p class="foot">Atajo: las flechas ← → del teclado avanzan o retroceden.</p>
  </details>`;
}

function vR1() {
  const i = S.r1;
  if (i >= R1.length) {
    const total = S.hands.reduce((a, b) => a + b, 0);
    return `<div class="eyebrow">Parte 1 · ¿Y vos?</div>
    <h2>No es algo lejano: nos pasa a todos.</h2>
    <p class="lead">Entre las cuatro preguntas se levantaron <b>${total}</b> manos.</p>
    <div class="card" style="margin-top:28px;display:flex;gap:28px;flex-wrap:wrap;align-items:center">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:120px;line-height:1;color:var(--red)">99 %</div>
      <div style="flex:1 1 380px;font-size:26px;line-height:1.4">de la población mundial respira aire que supera los límites de calidad recomendados por la OMS.<span class="foot" style="display:block">Fuente: Organización Mundial de la Salud, 2022</span></div>
    </div>
    <div class="row" style="margin-top:28px"><button class="btn ghost" data-act="r1prev">← Atrás</button><button class="btn green" data-go="r2">Ir a la trivia →</button></div>`;
  }
  return `<div class="eyebrow">Parte 1 · ¿Y vos? · ${i + 1} de ${R1.length}</div>
  <p class="big-q">${R1[i]}</p>
  <div class="counter" aria-label="Manos levantadas">
    <button class="sq" data-act="handDown" aria-label="Restar una mano">−</button>
    <div class="n" aria-live="polite">${S.hands[i]}</div>
    <button class="sq" data-act="handUp" aria-label="Sumar una mano">+</button>
    <span class="kbd">manos levantadas</span>
  </div>
  <div class="progress"><span style="width:${((i + 1) / R1.length) * 100}%"></span></div>
  <div class="row" style="margin-top:28px"><button class="btn ghost" data-act="r1prev" ${i === 0 ? 'disabled' : ''}>← Atrás</button><button class="btn" data-act="r1next">Siguiente →</button></div>`;
}

function vR2() {
  if (S.q >= QS.length) {
    return `<div class="eyebrow">Parte 2 · Trivia</div><h2>¡Terminó la trivia!</h2>
    ${podium()}
    <div class="row" style="margin-top:28px"><button class="btn ghost" data-act="qprev">← Última pregunta</button><button class="btn green" data-go="r3">Ir al experimento →</button></div>`;
  }
  const Q = QS[S.q];
  const colors = ['#2B7BD6', '#E0A23A', '#B5468C', '#2F9E5B'];
  const opts = Q.o.map((o, k) => {
    const cls = S.revealed ? (k === Q.a ? 'right' : 'dim') : '';
    return `<div class="opt ${cls}"><span class="l" style="background:${colors[k]}">${k + 1}</span>${o}</div>`;
  }).join('');
  const aw = S.awarded[S.q] || [];
  return `<div class="eyebrow">Parte 2 · Trivia · Pregunta ${S.q + 1} de ${QS.length}</div>
  <p class="big-q">${Q.q}</p>
  <div class="opts">${opts}</div>
  ${S.revealed ? `<div class="explain">${Q.e}${Q.s ? `<span class="src">${Q.s}</span>` : ''}</div>
    <div class="award"><span class="tag">¿Quién acertó? (+1)</span>${S.teams.map((t, i) => `<button class="tbtn" data-award="${i}" aria-pressed="${aw.includes(i)}"><span class="sw" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)}</button>`).join('')}</div>` : ''}
  <div class="row" style="margin-top:28px">
    <button class="btn ghost" data-act="qprev" ${S.q === 0 ? 'disabled' : ''}>← Atrás</button>
    ${S.revealed ? `<button class="btn" data-act="qnext">Siguiente pregunta →</button>` : `<button class="btn ghost" data-act="qtimer">${S.timer ? 'Pausar' : 'Cronómetro 20 s'}</button><span class="timer ${S.left <= 5 ? 'low' : ''}" aria-live="polite">${S.left}</span><button class="btn green" data-act="reveal">Revelar respuesta</button>`}
  </div>`;
}

function vR3() {
  const step = S.exp;
  return `<div class="eyebrow">Parte 3 · Experimento en vivo</div>
  <h2>El soplido: ¿se puede ver el CO₂?</h2>
  <div class="grid2" style="margin-top:26px">
    <div class="card">
      <div class="eyebrow" style="color:var(--ink)">Necesitan</div>
      <ul class="mat">
        <li>2 vasos transparentes con agua</li>
        <li>Indicador de pH: azul de bromotimol (del laboratorio del colegio o de un kit de pH para peceras), o jugo de repollo morado</li>
        <li>Pajillas, una por voluntario</li>
        <li>Opcional: un vaso preparado antes con una ramita de planta acuática bajo el sol</li>
      </ul>
      <div class="colors">
        <span style="display:flex;align-items:center;gap:10px"><span class="vial" style="background:#3C7FD0"></span>Antes</span>
        <span aria-hidden="true">→</span>
        <span style="display:flex;align-items:center;gap:10px"><span class="vial" style="background:#E3C93A"></span>Después de soplar</span>
      </div>
      <p class="foot">Con azul de bromotimol: de azul a amarillo-verdoso. Con repollo morado (y una pizca de bicarbonato): de verde-azul a morado. El cambio con repollo es más leve.</p>
    </div>
    <div class="card">
      <div class="eyebrow" style="color:var(--ink)">Pasos</div>
      <ol class="steps">
        <li>Pongan el indicador en los dos vasos. Uno es el “testigo”: no se toca.</li>
        <li>Un voluntario de cada equipo sopla suave con la pajilla dentro del otro vaso.</li>
        <li>Todos miran: ¿qué equipo hace cambiar el color primero?</li>
      </ol>
      <div class="row" style="margin-top:20px">
        <button class="btn ghost" data-act="exptimer">${S.expTimer ? 'Pausar' : 'Cronómetro 60 s'}</button>
        <span class="timer ${S.expLeft <= 10 ? 'low' : ''}" aria-live="polite">${S.expLeft}</span>
      </div>
    </div>
  </div>
  ${step >= 1 ? `<div class="explain" style="font-size:22px"><b>¿Qué pasó?</b> Al soplar metemos CO₂ en el agua. El CO₂ se disuelve y forma ácido carbónico: <b>CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</b>. El agua se vuelve más ácida y el indicador cambia de color.<br><br>
  <b>Eso mismo pasa dentro del Smoke Killer</b>: el humo de la calle llena el agua de CO₂. Las microalgas se lo comen con la fotosíntesis y el agua vuelve a su color. Si trajeron el vaso con la planta, compárenlo: la planta “limpió” el CO₂.</div>` : ''}
  ${step >= 1 ? `<div class="award"><span class="tag">Equipo más rápido (+1)</span>${S.teams.map((t, i) => `<button class="tbtn" data-expaward="${i}" aria-pressed="${S.awarded.exp === i}"><span class="sw" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)}</button>`).join('')}</div>` : ''}
  <div class="row" style="margin-top:28px">
    ${step === 0 ? `<button class="btn green" data-act="expexplain">Mostrar explicación</button>` : `<button class="btn green" data-go="final">Ir al compromiso →</button>`}
  </div>`;
}

function vFinal() {
  const max = Math.max(1, ...S.pledges);
  return `<div class="eyebrow">Cierre · Mi compromiso por el aire</div>
  <h2>El Smoke Killer ayuda. Nosotros también podemos.</h2>
  <p class="lead">Cada persona elige <b>una</b> acción que va a hacer esta semana. Contemos las manos.</p>
  <div class="pledges">
    ${PLEDGES.map((p, i) => `<div class="pl"><span class="name">${p}</span><div class="bar"><span style="width:${(S.pledges[i] / max) * 100}%"></span></div>
    <div class="ctr"><button class="sq" data-pl="${i}" data-d="-1" aria-label="Restar en ${esc(p)}">−</button><b>${S.pledges[i]}</b><button class="sq" data-pl="${i}" data-d="1" aria-label="Sumar en ${esc(p)}">+</button></div></div>`).join('')}
  </div>
  <h2 style="margin-top:44px">Equipo ganador</h2>
  ${podium()}
  <p class="lead" style="margin-top:28px">Gracias por respirar con nosotros. <b style="color:var(--green-d)">Menos humo, más oxígeno.</b></p>`;
}

function podium() {
  const sorted = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.pts - a.pts);
  const top = sorted[0].pts;
  return `<div class="podium">${sorted.map(t => `<div class="pod ${t.pts === top && top > 0 ? 'win' : ''}"><div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px"><span class="sw" style="background:${TEAM_COLORS[t.i]}"></span>${esc(t.name)}</div><div class="p">${t.pts}</div><div class="kbd">puntos</div></div>`).join('')}</div>`;
}

function render() {
  renderNav();
  const v = { inicio: vInicio, r1: vR1, r2: vR2, r3: vR3, final: vFinal }[S.view];
  $('#main').innerHTML = v();
}

function award(i, q) {
  const arr = S.awarded[q] || (S.awarded[q] = []);
  const k = arr.indexOf(i);
  if (k >= 0) { arr.splice(k, 1); S.teams[i].pts--; } else { arr.push(i); S.teams[i].pts++; }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.award !== undefined) { award(+b.dataset.award, S.q); return render(); }
  if (b.dataset.expaward !== undefined) {
    const i = +b.dataset.expaward;
    if (S.awarded.exp !== undefined) S.teams[S.awarded.exp].pts--;
    if (S.awarded.exp === i) delete S.awarded.exp; else { S.awarded.exp = i; S.teams[i].pts++; }
    return render();
  }
  if (b.dataset.pl !== undefined) { const i = +b.dataset.pl; S.pledges[i] = Math.max(0, S.pledges[i] + +b.dataset.d); return render(); }
  const a = b.dataset.act;
  if (a === 'addTeam' && S.teams.length < 4) { S.teams.push({ name: ['Equipo Verde', 'Equipo Azul', 'Equipo Amarillo', 'Equipo Morado'][S.teams.length], pts: 0 }); }
  if (a === 'rmTeam' && S.teams.length > 2) { S.teams.pop(); }
  if (a === 'handUp') S.hands[S.r1]++;
  if (a === 'handDown') S.hands[S.r1] = Math.max(0, S.hands[S.r1] - 1);
  if (a === 'r1next') S.r1++;
  if (a === 'r1prev') S.r1 = Math.max(0, S.r1 - 1);
  if (a === 'reveal') { stopTimers(); S.revealed = true; }
  if (a === 'qnext') { S.q++; S.revealed = false; S.left = 20; }
  if (a === 'qprev') { stopTimers(); S.q = Math.max(0, S.q - 1); S.revealed = S.q < QS.length && !!S.awarded[S.q]; S.left = 20; }
  if (a === 'qtimer') {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
    else { if (S.left <= 0) S.left = 20; S.timer = setInterval(() => { S.left--; if (S.left <= 0) { S.left = 0; clearInterval(S.timer); S.timer = null; } if (S.view === 'r2' && !S.revealed) render(); }, 1000); }
  }
  if (a === 'exptimer') {
    if (S.expTimer) { clearInterval(S.expTimer); S.expTimer = null; }
    else { if (S.expLeft <= 0) S.expLeft = 60; S.expTimer = setInterval(() => { S.expLeft--; if (S.expLeft <= 0) { S.expLeft = 0; clearInterval(S.expTimer); S.expTimer = null; } if (S.view === 'r3') render(); }, 1000); }
  }
  if (a === 'expexplain') S.exp = 1;
  render();
});

document.addEventListener('input', (e) => {
  const i = e.target.dataset.team; if (i === undefined) return;
  S.teams[+i].name = e.target.value || `Equipo ${+i + 1}`;
  renderNav();
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const order = VIEWS.map(v => v[0]);
  if (e.key === 'ArrowRight') {
    if (S.view === 'r1' && S.r1 < R1.length) { S.r1++; return render(); }
    if (S.view === 'r2' && S.q < QS.length) { if (!S.revealed) { stopTimers(); S.revealed = true; } else { S.q++; S.revealed = false; S.left = 20; } return render(); }
    const k = order.indexOf(S.view); if (k < order.length - 1) go(order[k + 1]);
  }
  if (e.key === 'ArrowLeft') {
    if (S.view === 'r1' && S.r1 > 0) { S.r1--; return render(); }
    if (S.view === 'r2' && S.q > 0) { S.q--; S.revealed = !!S.awarded[S.q]; return render(); }
    const k = order.indexOf(S.view); if (k > 0) go(order[k - 1]);
  }
});

render();
</script>
</body>
</html>
