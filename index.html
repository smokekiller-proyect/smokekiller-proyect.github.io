<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Killer Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--ink:#16211C;--muted:#4A5A51;--bg:#F4F7F5;--card:#FFFFFF;--line:#D5DED8;--green:#2F9E5B;--green-d:#1F6B3E;--blue:#2B7BD6;--red:#C8443E;--amber:#E0A23A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 28px;background:var(--ink);color:#fff}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;margin-right:8px}
.brand b{color:#4FE08F}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
nav button{background:transparent;color:#C9D6CE;border:1px solid transparent;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;min-height:44px}
nav button[aria-current="step"]{background:#fff;color:var(--ink)}
nav button:hover{border-color:#5E7468}
.score-strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#24332B;font-weight:600;font-size:15px}
.chip .dot{width:12px;height:12px;border-radius:6px}
.chip .pts{font-family:'Space Grotesk',sans-serif;font-size:20px}
main{flex:1 1 auto;width:100%;max-width:1280px;margin:0 auto;padding:40px 28px 48px}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d)}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(44px,6vw,84px);line-height:1;margin:12px 0 0;letter-spacing:-.01em}
h1 b{color:var(--green)}
h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,4vw,54px);line-height:1.08;margin:12px 0 0}
.lead{font-size:clamp(20px,2vw,26px);line-height:1.45;color:var(--muted);max-width:900px;margin:18px 0 0}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;min-height:52px;background:var(--ink);color:#fff}
.btn:hover{background:#2C3D34}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.team-in{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.team-in input{flex:1;border:none;font:600 20px Inter,sans-serif;color:var(--ink);background:transparent;min-width:0;padding:6px 0}
.team-in input:focus{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}
.sw{width:22px;height:22px;border-radius:11px;flex:0 0 22px}
.big-q{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,3.6vw,50px);line-height:1.15;margin:18px 0 0;max-width:1100px}
.counter{display:flex;align-items:center;gap:18px;margin-top:28px}
.counter .n{font-family:'Space Grotesk',sans-serif;font-size:72px;min-width:120px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:28px}
.opt{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:18px;background:#fff;border:2px solid var(--line);font-size:clamp(20px,2vw,26px);font-weight:600;text-align:left;color:var(--ink)}
.opt .l{flex:0 0 52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:26px;color:#fff}
.opt.right{border-color:var(--green);background:#E6F4EC}
.opt.dim{opacity:.4}
.explain{margin-top:22px;padding:22px 26px;border-radius:18px;background:#E8F1FB;color:#163A60;font-size:21px;line-height:1.5}
.explain .src{display:block;margin-top:8px;font-size:15px;color:#3C5A7A}
.award{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.award .tag{font-weight:700;font-size:17px;margin-right:6px}
.tbtn{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;min-height:48px;color:var(--ink)}
.tbtn[aria-pressed="true"]{border-color:var(--green);background:#E6F4EC}
.timer{font-family:'Space Grotesk',sans-serif;font-size:44px;min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.progress{height:8px;border-radius:4px;background:#DDE5E0;margin-top:20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--green)}
.steps{counter-reset:s;list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;font-size:20px;line-height:1.45}
.steps li::before{content:counter(s);flex:0 0 36px;height:36px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif}
.mat{margin:12px 0 0;padding-left:22px;font-size:19px;line-height:1.6}
.colors{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;align-items:center;font-size:19px;font-weight:600}
.vial{width:46px;height:70px;border-radius:0 0 18px 18px;border:3px solid #9FB0A6;border-top:none}
.pledges{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.pl{display:grid;grid-template-columns:minmax(220px,340px) 1fr auto;gap:16px;align-items:center}
.pl .name{font-size:21px;font-weight:600}
.pl .bar{height:34px;border-radius:10px;background:#E3E9E5;overflow:hidden}
.pl .bar span{display:block;height:100%;background:var(--green);transition:width .3s}
.pl .ctr{display:flex;align-items:center;gap:8px}
.pl .ctr b{font-family:'Space Grotesk',sans-serif;font-size:26px;min-width:44px;text-align:center}
.sq{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:700;color:var(--ink)}
.podium{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px}
.pod{flex:1 1 200px;padding:22px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.pod.win{border-color:var(--green);background:#E6F4EC}
.pod .p{font-family:'Space Grotesk',sans-serif;font-size:56px;line-height:1}
.guide{margin-top:34px}
.guide summary{font-weight:700;font-size:18px;cursor:pointer;padding:8px 0;min-height:44px}
.guide table{border-collapse:collapse;width:100%;font-size:17px;margin-top:10px}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.foot{margin-top:24px;font-size:14px;color:var(--muted)}
.hidden{display:none !important}
.kbd{font-size:14px;color:var(--muted)}
@media (max-width:640px){.opts{grid-template-columns:1fr}.pl{grid-template-columns:1fr}main{padding:28px 18px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">SMOKE <b>KILLER</b> CHALLENGE</div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="score-strip" id="strip" aria-label="Score"></div>
</header>
<main id="main"></main>
</div>

<script>
const TEAM_COLORS = ['#2F9E5B', '#2B7BD6', '#E0A23A', '#B5468C'];
const S = {
  view: 'inicio',
  teams: [{ name: 'Green Team', pts: 0 }, { name: 'Blue Team', pts: 0 }, { name: 'Yellow Team', pts: 0 }],
  r1: 0, hands: [0, 0, 0, 0],
  q: 0, revealed: false, awarded: {},
  timer: null, left: 20,
  exp: 0, expTimer: null, expLeft: 60,
  pledges: [0, 0, 0, 0, 0, 0],
};
const VIEWS = [['inicio', 'Start'], ['r1', '1 · What about you?'], ['r2', '2 · Trivia'], ['r3', '3 · Experiment'], ['final', 'Pledge & winner']];

const R1 = [
  'Raise your hand if you have ever coughed because of smoke from a bus or a car.',
  'Raise your hand if you walk or wait for the bus next to a busy street.',
  'Raise your hand if you know someone with asthma or allergies.',
  'Raise your hand if you have ever seen the sky turn grey from smoke or pollution.',
];

const QS = [
  { q: 'Which gas do the microalgae inside Smoke Killer “eat”?', o: ['Oxygen', 'Carbon dioxide (CO₂)', 'Nitrogen', 'Helium'], a: 1,
    e: 'Microalgae use CO₂ from the air to grow, just like plants. The carbon stays in their bodies (the biomass).' },
  { q: 'In photosynthesis, where does the released oxygen come from?', o: ['From CO₂', 'From water (H₂O)', 'From the sun', 'From the nutrients'], a: 1,
    e: 'Trick question! Light splits water molecules: 2 H₂O → O₂ + 4 H⁺ + 4 e⁻. The oxygen comes from water, not from CO₂.' },
  { q: 'Which part of Smoke Killer traps the soot and dust in smoke?', o: ['The microalgae', 'The filter', 'The solar panel', 'The tank'], a: 1,
    e: 'The algae eat CO₂, but not soot. That is why the air first goes through a filter that traps the particles.' },
  { q: 'How small is a PM2.5 particle compared with the width of a human hair?', o: ['The same size', 'Half as wide', 'About 30 times smaller', 'Bigger than a hair'], a: 2,
    e: 'A hair is about 70 micrometers wide; PM2.5 is 2.5 or less. They are small enough to reach deep into the lungs.',
    s: 'Source: U.S. Environmental Protection Agency (EPA)' },
  { q: 'According to the WHO, what share of the world population breathes air that exceeds its quality limits?', o: ['25%', '50%', '75%', '99%'], a: 3,
    e: 'Almost everyone: 99% of people breathe air that exceeds the limits recommended by the WHO.',
    s: 'Source: World Health Organization, 2022' },
  { q: 'How many deaths per year does the WHO link to air pollution?', o: ['70 thousand', '700 thousand', '7 million', '70 million'], a: 2,
    e: 'The WHO estimates about 7 million premature deaths a year from polluted air, outdoors and inside homes.',
    s: 'Source: World Health Organization' },
  { q: 'What happens to the algae harvested from Smoke Killer?', o: ['Thrown in the trash', 'Fertilizer or biogas', 'Burned', 'Released into the street'], a: 1,
    e: 'The algae biomass becomes plant fertilizer or is used to make biogas. Nothing goes to waste.' },
  { q: 'For every 1 kg of CO₂ the algae fix, roughly how much oxygen do they release?', o: ['None', 'About 0.73 kg', 'About 5 kg', 'About 100 kg'], a: 1,
    e: 'From the photosynthesis equation (6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂): 6 × 32 g of O₂ for every 6 × 44 g of CO₂ ≈ 0.73.' },
];

const PLEDGES = ['Walk, bike or take the bus when I can', 'Never burn trash or leaves', 'Plant and care for a tree', 'Turn off the engine when the car is parked', 'Share rides with others', 'Tell my family what I learned today'];

const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function go(v) { stopTimers(); S.view = v; render(); window.scrollTo(0, 0); }
function stopTimers() { clearInterval(S.timer); S.timer = null; clearInterval(S.expTimer); S.expTimer = null; }

function renderNav() {
  $('#nav').innerHTML = VIEWS.map(([k, l]) => `<button data-go="${k}" ${S.view === k ? 'aria-current="step"' : ''}>${l}</button>`).join('');
  $('#strip').innerHTML = S.teams.map((t, i) => `<span class="chip"><span class="dot" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)} <span class="pts">${t.pts}</span></span>`).join('');
}

function vInicio() {
  return `
  <div class="eyebrow">Audience activity · 12 minutes</div>
  <h1>How clean is the air <b>you breathe?</b></h1>
  <p class="lead">Form teams. We will play, guess and run a live experiment to understand how Smoke Killer works and why it matters to all of us.</p>
  <div class="teams">
    ${S.teams.map((t, i) => `<label class="team-in"><span class="sw" style="background:${TEAM_COLORS[i]}"></span><span class="hidden">Team ${i + 1} name</span><input data-team="${i}" value="${esc(t.name)}" aria-label="Team ${i + 1} name"></label>`).join('')}
  </div>
  <div class="row" style="margin-top:18px">
    <button class="btn ghost" data-act="addTeam" ${S.teams.length >= 4 ? 'disabled' : ''}>+ Add team</button>
    <button class="btn ghost" data-act="rmTeam" ${S.teams.length <= 2 ? 'disabled' : ''}>− Remove team</button>
    <button class="btn green" data-go="r1">Start →</button>
  </div>
  <details class="guide card">
    <summary>Presenter guide</summary>
    <table>
      <tr><th>Part</th><th>Time</th><th>What to do</th></tr>
      <tr><td>1 · What about you?</td><td>2 min</td><td>Read each line out loud. Count the raised hands and log them with + / −. Close with the WHO fact.</td></tr>
      <tr><td>2 · Trivia</td><td>5 min</td><td>Each team answers with fingers (1, 2, 3 or 4). Run the timer, reveal the answer and mark the teams that got it right.</td></tr>
      <tr><td>3 · Experiment</td><td>3 min</td><td>One volunteer per team blows through a straw into the cup with indicator. Everyone watches the color change. Read the explanation.</td></tr>
      <tr><td>Pledge</td><td>2 min</td><td>Everyone picks one action; count hands per option. End by announcing the winning team.</td></tr>
    </table>
    <p class="foot">Shortcut: the ← → arrow keys move back and forward.</p>
  </details>`;
}

function vR1() {
  const i = S.r1;
  if (i >= R1.length) {
    const total = S.hands.reduce((a, b) => a + b, 0);
    return `<div class="eyebrow">Part 1 · What about you?</div>
    <h2>It is not far away: it happens to all of us.</h2>
    <p class="lead">Across the four questions, <b>${total}</b> hands went up.</p>
    <div class="card" style="margin-top:28px;display:flex;gap:28px;flex-wrap:wrap;align-items:center">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:120px;line-height:1;color:var(--red)">99 %</div>
      <div style="flex:1 1 380px;font-size:26px;line-height:1.4">of the world population breathes air that exceeds the quality limits recommended by the WHO.<span class="foot" style="display:block">Source: World Health Organization, 2022</span></div>
    </div>
    <div class="row" style="margin-top:28px"><button class="btn ghost" data-act="r1prev">← Back</button><button class="btn green" data-go="r2">Go to trivia →</button></div>`;
  }
  return `<div class="eyebrow">Part 1 · What about you? · ${i + 1} of ${R1.length}</div>
  <p class="big-q">${R1[i]}</p>
  <div class="counter" aria-label="Raised hands">
    <button class="sq" data-act="handDown" aria-label="Remove one hand">−</button>
    <div class="n" aria-live="polite">${S.hands[i]}</div>
    <button class="sq" data-act="handUp" aria-label="Add one hand">+</button>
    <span class="kbd">raised hands</span>
  </div>
  <div class="progress"><span style="width:${((i + 1) / R1.length) * 100}%"></span></div>
  <div class="row" style="margin-top:28px"><button class="btn ghost" data-act="r1prev" ${i === 0 ? 'disabled' : ''}>← Back</button><button class="btn" data-act="r1next">Next →</button></div>`;
}

function vR2() {
  if (S.q >= QS.length) {
    return `<div class="eyebrow">Part 2 · Trivia</div><h2>Trivia complete!</h2>
    ${podium()}
    <div class="row" style="margin-top:28px"><button class="btn ghost" data-act="qprev">← Last question</button><button class="btn green" data-go="r3">Go to the experiment →</button></div>`;
  }
  const Q = QS[S.q];
  const colors = ['#2B7BD6', '#E0A23A', '#B5468C', '#2F9E5B'];
  const opts = Q.o.map((o, k) => {
    const cls = S.revealed ? (k === Q.a ? 'right' : 'dim') : '';
    return `<div class="opt ${cls}"><span class="l" style="background:${colors[k]}">${k + 1}</span>${o}</div>`;
  }).join('');
  const aw = S.awarded[S.q] || [];
  return `<div class="eyebrow">Part 2 · Trivia · Question ${S.q + 1} of ${QS.length}</div>
  <p class="big-q">${Q.q}</p>
  <div class="opts">${opts}</div>
  ${S.revealed ? `<div class="explain">${Q.e}${Q.s ? `<span class="src">${Q.s}</span>` : ''}</div>
    <div class="award"><span class="tag">Who got it right? (+1)</span>${S.teams.map((t, i) => `<button class="tbtn" data-award="${i}" aria-pressed="${aw.includes(i)}"><span class="sw" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)}</button>`).join('')}</div>` : ''}
  <div class="row" style="margin-top:28px">
    <button class="btn ghost" data-act="qprev" ${S.q === 0 ? 'disabled' : ''}>← Back</button>
    ${S.revealed ? `<button class="btn" data-act="qnext">Next question →</button>` : `<button class="btn ghost" data-act="qtimer">${S.timer ? 'Pause' : '20 s timer'}</button><span class="timer ${S.left <= 5 ? 'low' : ''}" aria-live="polite">${S.left}</span><button class="btn green" data-act="reveal">Reveal answer</button>`}
  </div>`;
}

function vR3() {
  const step = S.exp;
  return `<div class="eyebrow">Part 3 · Live experiment</div>
  <h2>The breath test: can you see CO₂?</h2>
  <div class="grid2" style="margin-top:26px">
    <div class="card">
      <div class="eyebrow" style="color:var(--ink)">You need</div>
      <ul class="mat">
        <li>2 clear cups of water</li>
        <li>A pH indicator: bromothymol blue (from the school lab or an aquarium pH test kit), or red cabbage juice</li>
        <li>Straws, one per volunteer</li>
        <li>Optional: a cup prepared earlier with a sprig of aquatic plant left in the sun</li>
      </ul>
      <div class="colors">
        <span style="display:flex;align-items:center;gap:10px"><span class="vial" style="background:#3C7FD0"></span>Before</span>
        <span aria-hidden="true">→</span>
        <span style="display:flex;align-items:center;gap:10px"><span class="vial" style="background:#E3C93A"></span>After blowing</span>
      </div>
      <p class="foot">With bromothymol blue: from blue to greenish yellow. With red cabbage (plus a pinch of baking soda): from blue-green to purple. The cabbage change is subtler.</p>
    </div>
    <div class="card">
      <div class="eyebrow" style="color:var(--ink)">Steps</div>
      <ol class="steps">
        <li>Add the indicator to both cups. One is the control: nobody touches it.</li>
        <li>One volunteer from each team gently blows through a straw into the other cup.</li>
        <li>Everyone watches: which team changes the color first?</li>
      </ol>
      <div class="row" style="margin-top:20px">
        <button class="btn ghost" data-act="exptimer">${S.expTimer ? 'Pause' : '60 s timer'}</button>
        <span class="timer ${S.expLeft <= 10 ? 'low' : ''}" aria-live="polite">${S.expLeft}</span>
      </div>
    </div>
  </div>
  ${step >= 1 ? `<div class="explain" style="font-size:22px"><b>What happened?</b> Blowing puts CO₂ into the water. CO₂ dissolves and forms carbonic acid: <b>CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</b>. The water becomes more acidic and the indicator changes color.<br><br>
  <b>The same thing happens inside Smoke Killer</b>: street smoke loads the water with CO₂. The microalgae eat it through photosynthesis and the water returns to its color. If you brought the cup with the plant, compare: the plant “cleaned” the CO₂.</div>` : ''}
  ${step >= 1 ? `<div class="award"><span class="tag">Fastest team (+1)</span>${S.teams.map((t, i) => `<button class="tbtn" data-expaward="${i}" aria-pressed="${S.awarded.exp === i}"><span class="sw" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)}</button>`).join('')}</div>` : ''}
  <div class="row" style="margin-top:28px">
    ${step === 0 ? `<button class="btn green" data-act="expexplain">Show explanation</button>` : `<button class="btn green" data-go="final">Go to the pledge →</button>`}
  </div>`;
}

function vFinal() {
  const max = Math.max(1, ...S.pledges);
  return `<div class="eyebrow">Closing · My pledge for clean air</div>
  <h2>Smoke Killer helps. So can we.</h2>
  <p class="lead">Everyone picks <b>one</b> action to take this week. Let’s count hands.</p>
  <div class="pledges">
    ${PLEDGES.map((p, i) => `<div class="pl"><span class="name">${p}</span><div class="bar"><span style="width:${(S.pledges[i] / max) * 100}%"></span></div>
    <div class="ctr"><button class="sq" data-pl="${i}" data-d="-1" aria-label="Subtract from ${esc(p)}">−</button><b>${S.pledges[i]}</b><button class="sq" data-pl="${i}" data-d="1" aria-label="Add to ${esc(p)}">+</button></div></div>`).join('')}
  </div>
  <h2 style="margin-top:44px">Winning team</h2>
  ${podium()}
  <p class="lead" style="margin-top:28px">Thanks for breathing with us. <b style="color:var(--green-d)">Less smoke, more oxygen.</b></p>`;
}

function podium() {
  const sorted = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.pts - a.pts);
  const top = sorted[0].pts;
  return `<div class="podium">${sorted.map(t => `<div class="pod ${t.pts === top && top > 0 ? 'win' : ''}"><div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px"><span class="sw" style="background:${TEAM_COLORS[t.i]}"></span>${esc(t.name)}</div><div class="p">${t.pts}</div><div class="kbd">points</div></div>`).join('')}</div>`;
}

function render() {
  renderNav();
  const v = { inicio: vInicio, r1: vR1, r2: vR2, r3: vR3, final: vFinal }[S.view];
  $('#main').innerHTML = v();
}

function award(i, q) {
  const arr = S.awarded[q] || (S.awarded[q] = []);
  const k = arr.indexOf(i);
  if (k >= 0) { arr.splice(k, 1); S.teams[i].pts--; } else { arr.push(i); S.teams[i].pts++; }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.award !== undefined) { award(+b.dataset.award, S.q); return render(); }
  if (b.dataset.expaward !== undefined) {
    const i = +b.dataset.expaward;
    if (S.awarded.exp !== undefined) S.teams[S.awarded.exp].pts--;
    if (S.awarded.exp === i) delete S.awarded.exp; else { S.awarded.exp = i; S.teams[i].pts++; }
    return render();
  }
  if (b.dataset.pl !== undefined) { const i = +b.dataset.pl; S.pledges[i] = Math.max(0, S.pledges[i] + +b.dataset.d); return render(); }
  const a = b.dataset.act;
  if (a === 'addTeam' && S.teams.length < 4) { S.teams.push({ name: ['Green Team', 'Blue Team', 'Yellow Team', 'Purple Team'][S.teams.length], pts: 0 }); }
  if (a === 'rmTeam' && S.teams.length > 2) { S.teams.pop(); }
  if (a === 'handUp') S.hands[S.r1]++;
  if (a === 'handDown') S.hands[S.r1] = Math.max(0, S.hands[S.r1] - 1);
  if (a === 'r1next') S.r1++;
  if (a === 'r1prev') S.r1 = Math.max(0, S.r1 - 1);
  if (a === 'reveal') { stopTimers(); S.revealed = true; }
  if (a === 'qnext') { S.q++; S.revealed = false; S.left = 20; }
  if (a === 'qprev') { stopTimers(); S.q = Math.max(0, S.q - 1); S.revealed = S.q < QS.length && !!S.awarded[S.q]; S.left = 20; }
  if (a === 'qtimer') {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
    else { if (S.left <= 0) S.left = 20; S.timer = setInterval(() => { S.left--; if (S.left <= 0) { S.left = 0; clearInterval(S.timer); S.timer = null; } if (S.view === 'r2' && !S.revealed) render(); }, 1000); }
  }
  if (a === 'exptimer') {
    if (S.expTimer) { clearInterval(S.expTimer); S.expTimer = null; }
    else { if (S.expLeft <= 0) S.expLeft = 60; S.expTimer = setInterval(() => { S.expLeft--; if (S.expLeft <= 0) { S.expLeft = 0; clearInterval(S.expTimer); S.expTimer = null; } if (S.view === 'r3') render(); }, 1000); }
  }
  if (a === 'expexplain') S.exp = 1;
  render();
});

document.addEventListener('input', (e) => {
  const i = e.target.dataset.team; if (i === undefined) return;
  S.teams[+i].name = e.target.value || `Team ${+i + 1}`;
  renderNav();
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const order = VIEWS.map(v => v[0]);
  if (e.key === 'ArrowRight') {
    if (S.view === 'r1' && S.r1 < R1.length) { S.r1++; return render(); }
    if (S.view === 'r2' && S.q < QS.length) { if (!S.revealed) { stopTimers(); S.revealed = true; } else { S.q++; S.revealed = false; S.left = 20; } return render(); }
    const k = order.indexOf(S.view); if (k < order.length - 1) go(order[k + 1]);
  }
  if (e.key === 'ArrowLeft') {
    if (S.view === 'r1' && S.r1 > 0) { S.r1--; return render(); }
    if (S.view === 'r2' && S.q > 0) { S.q--; S.revealed = !!S.awarded[S.q]; return render(); }
    const k = order.indexOf(S.view); if (k > 0) go(order[k - 1]);
  }
});

render();
</script>
</body>
</html>
