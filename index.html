<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Killer Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--ink:#16211C;--muted:#4A5A51;--bg:#F4F7F5;--card:#FFFFFF;--line:#D5DED8;--green:#2F9E5B;--green-d:#1F6B3E;--blue:#2B7BD6;--red:#C8443E;--amber:#E0A23A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 28px;background:var(--ink);color:#fff}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;margin-right:8px}
.brand b{color:#4FE08F}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
nav button{background:transparent;color:#C9D6CE;border:1px solid transparent;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;min-height:44px}
nav button[aria-current="step"]{background:#fff;color:var(--ink)}
nav button:hover{border-color:#5E7468}
.score-strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#24332B;font-weight:600;font-size:15px}
.chip .dot{width:12px;height:12px;border-radius:6px}
.chip .pts{font-family:'Space Grotesk',sans-serif;font-size:20px}
main{flex:1 1 auto;width:100%;max-width:1280px;margin:0 auto;padding:40px 28px 48px}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d)}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(44px,6vw,84px);line-height:1;margin:12px 0 0;letter-spacing:-.01em}
h1 b{color:var(--green)}
h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,4vw,54px);line-height:1.08;margin:12px 0 0}
.lead{font-size:clamp(20px,2vw,26px);line-height:1.45;color:var(--muted);max-width:900px;margin:18px 0 0}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;min-height:52px;background:var(--ink);color:#fff}
.btn:hover{background:#2C3D34}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.team-in{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.team-in input{flex:1;border:none;font:600 20px Inter,sans-serif;color:var(--ink);background:transparent;min-width:0;padding:6px 0}
.team-in input:focus{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}
.sw{width:22px;height:22px;border-radius:11px;flex:0 0 22px}
.big-q{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,3.6vw,50px);line-height:1.15;margin:18px 0 0;max-width:1100px}
.counter{display:flex;align-items:center;gap:18px;margin-top:28px}
.counter .n{font-family:'Space Grotesk',sans-serif;font-size:72px;min-width:120px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:28px}
.opt{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:18px;background:#fff;border:2px solid var(--line);font-size:clamp(20px,2vw,26px);font-weight:600;text-align:left;color:var(--ink)}
.opt .l{flex:0 0 52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:26px;color:#fff}
.opt.right{border-color:var(--green);background:#E6F4EC}
.opt.dim{opacity:.4}
.explain{margin-top:22px;padding:22px 26px;border-radius:18px;background:#E8F1FB;color:#163A60;font-size:21px;line-height:1.5}
.explain .src{display:block;margin-top:8px;font-size:15px;color:#3C5A7A}
.award{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.award .tag{font-weight:700;font-size:17px;margin-right:6px}
.tbtn{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;min-height:48px;color:var(--ink)}
.tbtn[aria-pressed="true"]{border-color:var(--green);background:#E6F4EC}
.timer{font-family:'Space Grotesk',sans-serif;font-size:44px;min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.progress{height:8px;border-radius:4px;background:#DDE5E0;margin-top:20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--green)}
.steps{counter-reset:s;list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;font-size:20px;line-height:1.45}
.steps li::before{content:counter(s);flex:0 0 36px;height:36px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif}
.mat{margin:12px 0 0;padding-left:22px;font-size:19px;line-height:1.6}
.colors{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;align-items:center;font-size:19px;font-weight:600}
.vial{width:46px;height:70px;border-radius:0 0 18px 18px;border:3px solid #9FB0A6;border-top:none}
.pledges{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.pl{display:grid;grid-template-columns:minmax(220px,340px) 1fr auto;gap:16px;align-items:center}
.pl .name{font-size:21px;font-weight:600}
.pl .bar{height:34px;border-radius:10px;background:#E3E9E5;overflow:hidden}
.pl .bar span{display:block;height:100%;background:var(--green);transition:width .3s}
.pl .ctr{display:flex;align-items:center;gap:8px}
.pl .ctr b{font-family:'Space Grotesk',sans-serif;font-size:26px;min-width:44px;text-align:center}
.sq{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:700;color:var(--ink)}
.podium{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px}
.pod{flex:1 1 200px;padding:22px;border-radius:20px;background:#fff;border:2px solid var(--line)}
.pod.win{border-color:var(--green);background:#E6F4EC}
.pod .p{font-family:'Space Grotesk',sans-serif;font-size:56px;line-height:1}
.guide{margin-top:34px}
.guide summary{font-weight:700;font-size:18px;cursor:pointer;padding:8px 0;min-height:44px}
.guide table{border-collapse:collapse;width:100%;font-size:17px;margin-top:10px}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.foot{margin-top:24px;font-size:14px;color:var(--muted)}
.hidden{display:none !important}
.kbd{font-size:14px;color:var(--muted)}

/* ===== decorations ===== */
.app{position:relative;z-index:2}
main{padding-bottom:200px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center}
.hero-fig{margin:0;border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(22,33,28,.18);position:relative;animation:heroFloat 6s ease-in-out infinite}
.hero-fig img{display:block;width:100%;height:auto}
.hero-fig figcaption{position:absolute;left:14px;bottom:12px;padding:6px 12px;border-radius:999px;background:rgba(22,33,28,.8);color:#fff;font-size:14px;font-weight:600}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}}
.brand-leaf{display:inline-block;width:22px;height:22px;vertical-align:-3px;margin-right:6px;animation:leafSpin 5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes leafSpin{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
button.brand{cursor:pointer;background:none;border:none;color:#fff;padding:6px 4px;min-height:44px}
.floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-60px;opacity:.28;animation:floatUp var(--t,24s) linear var(--d,0s) infinite}
.fl svg{display:block;animation:sway 4s ease-in-out infinite}
@keyframes floatUp{0%{transform:translateY(0)}100%{transform:translateY(calc(-100vh - 120px))}}
@keyframes sway{0%,100%{transform:translateX(-14px) rotate(-12deg)}50%{transform:translateX(14px) rotate(12deg)}}
.scene{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:3;pointer-events:none;overflow:hidden}
.scene .sky-line{position:absolute;left:0;right:0;bottom:22px;width:100%;height:110px}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(#7CC46A,#5FA851)}
.scene .road{position:absolute;left:0;right:0;bottom:0;height:9px;background:#4A5157}
.tree{position:absolute;bottom:20px;transform-origin:50% 100%;animation:treeSway 5s ease-in-out infinite}
@keyframes treeSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.skb{position:absolute;bottom:20px;left:70%;width:130px;height:150px}
.fan{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tube{fill:#3FB37F;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{fill:#3FB37F}50%{fill:#5FE09A}}
.o2b{position:absolute;left:98px;top:0;width:12px;height:12px;border-radius:50%;background:rgba(127,212,255,.75);border:1.5px solid #2B7BD6;opacity:0;animation:o2up 3.6s ease-out var(--d,0s) infinite}
.o2b.t{width:auto;height:auto;padding:1px 5px;border-radius:9px;font:700 11px Inter,sans-serif;color:#1D5FAE;background:rgba(255,255,255,.9)}
@keyframes o2up{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--x,20px),-70px) scale(1.1);opacity:0}}
.puff{position:absolute;bottom:28px;left:var(--x);width:26px;height:26px;border-radius:50%;background:#8D9399;opacity:0;filter:blur(1px);animation:suck 7s ease-in var(--d,0s) infinite}
@keyframes suck{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.75}70%{opacity:.6}100%{transform:translate(calc(70vw + 14px - var(--x)),-90px) scale(.1);opacity:0}}
.runner{position:absolute;bottom:20px;left:0;transform:translateX(-160px);animation:run var(--t,12s) linear var(--d,0s) infinite;will-change:transform}
.runner.rtl{animation-name:runBack}
.runner.rtl > svg{transform:scaleX(-1)}
@keyframes run{0%{transform:translateX(-160px)}45%{transform:translateX(calc(100vw + 40px))}100%{transform:translateX(calc(100vw + 40px))}}
@keyframes runBack{0%{transform:translateX(calc(100vw + 40px))}45%{transform:translateX(-160px)}100%{transform:translateX(-160px)}}
.bob{animation:bob .32s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hop{animation:hop .55s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:legA .32s ease-in-out infinite}
.leg.b{animation-name:legB}
@keyframes legA{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes legB{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
.flyer{position:absolute;top:8px;left:0;transform:translateX(-160px);animation:run var(--t,16s) linear var(--d,0s) infinite}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .3s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.6)}}
.exh{position:absolute;right:-14px;bottom:6px;width:12px;height:12px;border-radius:50%;background:#9AA0A6;animation:exh .9s ease-out infinite}
.exh.b{animation-delay:.45s}
@keyframes exh{0%{transform:translate(0,0) scale(.5);opacity:.8}100%{transform:translate(26px,-18px) scale(1.6);opacity:0}}
.fx{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.smog{position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#9CA2A8,#6E747A);filter:blur(2px);opacity:0}
.smog .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 18px Inter,sans-serif;color:#fff}
.sk-hero{position:absolute;width:240px}
.sk-hero svg{display:block;width:100%;height:auto}
/* ===== player + live results ===== */
.join{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.join label{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:17px;flex:1 1 280px;max-width:460px}
.join input{font:600 22px Inter,sans-serif;padding:14px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);min-height:56px}
.join input:focus{outline:3px solid var(--blue);outline-offset:2px}
.hint{font-size:15px;color:var(--muted);margin-top:12px}
.linkrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.linkbtn{background:none;border:none;padding:10px 4px;font-weight:700;font-size:16px;color:var(--green-d);text-decoration:underline;min-height:44px}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:24px}
button.opt{width:100%;cursor:pointer}
button.opt:hover:not(:disabled){border-color:var(--ink)}
button.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--red);background:#FBEBEB}
.verdict{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:22px 0 0}
.verdict.ok{color:var(--green-d)} .verdict.no{color:var(--red)}
.score-big{font-family:'Space Grotesk',sans-serif;font-size:clamp(80px,14vw,150px);line-height:1;color:var(--green)}
.score-big small{font-size:.4em;color:var(--muted)}
.pl-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px}
.pl-pick button{padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font:600 17px Inter,sans-serif;text-align:left;color:var(--ink);min-height:52px}
.pl-pick button[aria-pressed="true"]{border-color:var(--green);background:#E6F4EC}
.msg{margin-top:16px;font-size:17px;font-weight:600}
.msg.err{color:var(--red)} .msg.ok{color:var(--green-d)}
.lb-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--green-d)}
.live i{width:10px;height:10px;border-radius:5px;background:var(--green);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pod3{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-top:26px}
.pcard{border-radius:20px;background:#fff;border:2px solid var(--line);padding:18px;text-align:center}
.pcard .medal{width:46px;height:46px;border-radius:23px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font:700 22px 'Space Grotesk',sans-serif;color:#fff}
.pcard .nm{font-weight:700;font-size:22px;word-break:break-word}
.pcard .sc{font-family:'Space Grotesk',sans-serif;font-size:40px;line-height:1.1}
.pcard.first{border-color:var(--green);background:#E6F4EC;padding:26px 18px}
.pcard.first .sc{font-size:54px}
.lb-list{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.lb-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:20px}
.lb-row .rk{font-family:'Space Grotesk',sans-serif;color:var(--muted)}
.lb-row .nm{font-weight:600;word-break:break-word}
.lb-row .sc{font-family:'Space Grotesk',sans-serif;font-size:24px}
.lb-row.me{border-color:var(--blue);background:#E7F1FB}
.lb-empty{margin-top:26px;padding:28px;border-radius:20px;background:#fff;border:2px dashed var(--line);font-size:22px;text-align:center;color:var(--muted)}
.lb-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;margin-top:8px;align-items:start}
@media (max-width:900px){.lb-grid{grid-template-columns:1fr}.pod3{grid-template-columns:1fr}}
.tally{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tally .t{display:grid;grid-template-columns:1fr 40px;gap:8px;font-size:15px;font-weight:600}
.tally .bar{grid-column:1 / -1;height:12px;border-radius:6px;background:#E3E9E5;overflow:hidden}
.tally .bar span{display:block;height:100%;background:var(--green)}

@media (max-width:640px){.sk-hero{width:160px}.say{left:auto;right:0;top:-48px;font-size:14px}.scene{height:120px}.skb{transform:scale(.8);transform-origin:bottom left}}
.sk-hero .fan{animation-duration:.5s}
.sk-hero .tube{animation-duration:1s}
.say{position:absolute;left:-170px;top:-6px;padding:10px 16px;border-radius:18px 18px 4px 18px;background:#16211C;color:#fff;font:700 17px Inter,sans-serif;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.say b{color:#4FE08F}
.bub{position:absolute;border-radius:50%;background:rgba(127,212,255,.7);border:2px solid #2B7BD6}
.bub.o2{width:auto;height:auto;padding:3px 9px;border-radius:14px;background:#fff;color:#1D5FAE;font:700 16px Inter,sans-serif}
.cf{position:absolute;top:-40px}
@media (prefers-reduced-motion: reduce){.floaters,.fx{display:none}.scene *,.hero-fig,.brand-leaf{animation:none !important}}

@media (max-width:640px){.opts{grid-template-columns:1fr}.pl{grid-template-columns:1fr}main{padding:28px 18px}}
</style>
</head>

<script>
const TEAM_COLORS = ['#2F9E5B', '#2B7BD6', '#E0A23A', '#B5468C'];
const S = {
  view: (location.hash === '#results') ? 'results' : (location.hash === '#presenter' ? 'inicio' : 'play'),
  teams: [{ name: 'Green Team', pts: 0 }, { name: 'Blue Team', pts: 0 }, { name: 'Yellow Team', pts: 0 }],
  r1: 0, hands: [0, 0, 0, 0],
  q: 0, revealed: false, awarded: {},
  timer: null, left: 20,
  pledges: [0, 0, 0, 0, 0, 0],
};
const VIEWS = [['inicio', 'Start'], ['r1', '1 · What about you?'], ['r2', '2 · Trivia'], ['final', 'Pledge & winner']];
const PRESENTER = ['inicio', 'r1', 'r2', 'final'];
const TOPIC = 'smokekiller-proyect-live-8q3v2x';
const NTFY = 'https://ntfy.sh/' + TOPIC;
const R1P = ['Have you ever coughed because of smoke from a bus or a car?', 'Do you walk or wait for the bus next to a busy street?', 'Do you know someone with asthma or allergies?', 'Have you ever seen the sky turn grey from smoke or pollution?'];
const R1S = ['Coughed from bus or car smoke', 'Walk or wait next to busy streets', 'Know someone with asthma or allergies', 'Have seen a grey, polluted sky'];
const P = { draft: '', name: '', id: Math.random().toString(36).slice(2, 10), started: false, r: 0, yes: [], i: 0, score: 0, picked: null, pledge: null, sent: false, sending: false, err: '' };
const LB = { entries: [], loaded: false, ok: true, timer: null, lastCount: 0 };
let ROUND = 0; try { ROUND = +localStorage.getItem('sk-round') || 0; } catch (e) {}

const R1 = [
  'Raise your hand if you have ever coughed because of smoke from a bus or a car.',
  'Raise your hand if you walk or wait for the bus next to a busy street.',
  'Raise your hand if you know someone with asthma or allergies.',
  'Raise your hand if you have ever seen the sky turn grey from smoke or pollution.',
];

const QS = [
  { q: 'Which gas do the microalgae inside Smoke Killer “eat”?', o: ['Oxygen', 'Carbon dioxide (CO₂)', 'Nitrogen', 'Helium'], a: 1,
    e: 'Microalgae use CO₂ from the air to grow, just like plants. The carbon stays in their bodies (the biomass).' },
  { q: 'In photosynthesis, where does the released oxygen come from?', o: ['From CO₂', 'From water (H₂O)', 'From the sun', 'From the nutrients'], a: 1,
    e: 'Trick question! Light splits water molecules: 2 H₂O → O₂ + 4 H⁺ + 4 e⁻. The oxygen comes from water, not from CO₂.' },
  { q: 'Which part of Smoke Killer traps the soot and dust in smoke?', o: ['The microalgae', 'The filter', 'The solar panel', 'The tank'], a: 1,
    e: 'The algae eat CO₂, but not soot. That is why the air first goes through a filter that traps the particles.' },
  { q: 'How many deaths per year does the WHO link to air pollution?', o: ['70 thousand', '700 thousand', '7 million', '70 million'], a: 2,
    e: 'The WHO estimates about 7 million premature deaths a year from polluted air, outdoors and inside homes.',
    s: 'Source: World Health Organization' },
  { q: 'What happens to the algae harvested from Smoke Killer?', o: ['Thrown in the trash', 'Fertilizer or biogas', 'Burned', 'Released into the street'], a: 1,
    e: 'The algae biomass becomes plant fertilizer or is used to make biogas. Nothing goes to waste.' },
];

const PLEDGES = ['Walk, bike or take the bus when I can', 'Never burn trash or leaves', 'Plant and care for a tree', 'Turn off the engine when the car is parked', 'Share rides with others', 'Tell my family what I learned today'];

const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function go(v) { stopTimers(); S.view = v; P.err = ''; const h = v === 'results' ? '#results' : (PRESENTER.includes(v) ? '#presenter' : ''); try { history.replaceState(null, '', location.pathname + h); } catch (e) {} if (v === 'results') startPolling(); else stopPolling(); render(); window.scrollTo(0, 0); if (v === 'final') setTimeout(() => leafConfetti(60), 300); else if (v === 'r1' || v === 'r2') setTimeout(surprise, 600); }
function stopTimers() { clearInterval(S.timer); S.timer = null; }

function renderNav() {
  const pres = PRESENTER.includes(S.view);
  const items = [['play', 'Play'], ['results', 'Live results'], ['inicio', 'Presenter']].concat(pres ? VIEWS.slice(1) : []);
  $('#nav').innerHTML = items.map(([k, l]) => `<button data-go="${k}" ${S.view === k ? 'aria-current="step"' : ''}>${l}</button>`).join('');
  $('#strip').innerHTML = pres ? S.teams.map((t, i) => `<span class="chip"><span class="dot" style="background:${TEAM_COLORS[i]}"></span>${esc(t.name)} <span class="pts">${t.pts}</span></span>`).join('') : '';
}

// ---------- player ----------
function vPlay() {
  if (!P.started) {
    return `<div class="hero-grid">
    <div>
      <div class="eyebrow">Smoke Killer Challenge · ${QS.length} questions</div>
      <h1>How clean is the air <b>you breathe?</b></h1>
      <p class="lead">Write your name, answer 4 quick questions about your day and 5 trivia questions, and see your result on the big screen.</p>
      <form class="join" data-form="join">
        <label for="pname">Your name<input id="pname" maxlength="20" autocomplete="nickname" value="${esc(P.draft)}" placeholder="Type your name"></label>
        <button class="btn green" type="submit">Start playing →</button>
      </form>
      <p class="hint">Your name and score will appear on the live results screen.</p>
      ${P.err ? `<p class="msg err" role="alert">${esc(P.err)}</p>` : ''}
      <div class="linkrow"><button class="linkbtn" data-go="results">See live results</button></div>
    </div>
    <figure class="hero-fig"><img src="media/rooftop-city.jpg" alt="3D render of the Smoke Killer unit on a city rooftop, pulling in street smoke and releasing oxygen"><figcaption>Smoke Killer on a city rooftop</figcaption></figure>
  </div>`;
  }
  if (P.r < R1P.length) {
    return `<div class="eyebrow">${esc(P.name)} · Part 1 · What about you? · ${P.r + 1} of ${R1P.length}</div>
    <div class="progress"><span style="width:${(P.r / R1P.length) * 100}%"></span></div>
    <p class="big-q">${R1P[P.r]}</p>
    <div class="popts" style="max-width:720px">
      <button class="opt" data-yn="1"><span class="l" style="background:#2F9E5B">✓</span>Yes</button>
      <button class="opt" data-yn="0"><span class="l" style="background:#C8443E">✕</span>No</button>
    </div>
    <p class="hint">Your answer appears, without your name, in the audience results on the big screen.</p>`;
  }
  if (P.r === R1P.length) {
    const n = P.yes.filter(Boolean).length;
    return `<div class="eyebrow">Part 1 · What about you?</div>
    <h2>You said yes to ${n} of ${R1P.length}. It is not far away: it happens to all of us.</h2>
    <div class="card" style="margin-top:24px;display:flex;gap:24px;flex-wrap:wrap;align-items:center">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:96px;line-height:1;color:var(--red)">99%</div>
      <div style="flex:1 1 280px;font-size:22px;line-height:1.4">of the world population breathes air that exceeds the quality limits recommended by the WHO.<span class="foot" style="display:block">Source: World Health Organization, 2022</span></div>
    </div>
    <div class="row" style="margin-top:24px"><button class="btn green" data-act="pfact">Start the trivia →</button></div>`;
  }
  if (P.i < QS.length) {
    const Q = QS[P.i], colors = ['#2B7BD6', '#E0A23A', '#B5468C', '#2F9E5B'], done = P.picked !== null;
    const opts = Q.o.map((o, k) => {
      let cls = '';
      if (done) cls = k === Q.a ? 'right' : (k === P.picked ? 'wrong' : 'dim');
      return `<button class="opt ${cls}" data-pick="${k}" ${done ? 'disabled' : ''}><span class="l" style="background:${colors[k]}">${k + 1}</span>${o}</button>`;
    }).join('');
    return `<div class="eyebrow">${esc(P.name)} · Question ${P.i + 1} of ${QS.length} · ${P.score} correct</div>

async function sendResult() {
  P.sending = true; P.err = ''; render();

    const r = await fetch(NTFY, { method: 'POST', body });

    P.sent = true; setTimeout(() => leafConfetti(40), 100);
  } catch (e) {
    P.err = 'Could not send your result. Check your internet connection and try again.';
  }

// ---------- live results ----------
function cleanEntry(m) {
  let o; try { o = JSON.parse(m.message); } catch (e) { return null; }
  if (!o || o.v !== 1 || typeof o.n !== 'string' || typeof o.id !== 'string') return null;
  const n = o.n.trim().slice(0, 20); if (!n) return null;
  const t = QS.length, sc = Math.max(0, Math.min(t, Math.round(+o.s || 0)));
  const p = Number.isInteger(o.p) && o.p >= 0 && o.p < PLEDGES.length ? o.p : null;
  const y = Array.isArray(o.y) ? o.y.slice(0, R1P.length).map(v => v === 1 ? 1 : 0) : [];
  return { id: o.id.slice(0, 16), n, s: sc, p, y, time: m.time || 0 };
}
async function pollResults() {
  try {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const FROM = Math.max(ROUND || 0, Math.floor(d0.getTime() / 1000));
    const r = await fetch(`${NTFY}/json?poll=1&since=${FROM}`);
    if (!r.ok) throw new Error('status ' + r.status);
    const txt = await r.text();
    const byId = new Map();
    txt.split('\n').forEach(line => {
      if (!line.trim()) return;
      let m; try { m = JSON.parse(line); } catch (e) { return; }
      if (m.event !== 'message' || m.time < FROM) return;
      const e = cleanEntry(m); if (e) byId.set(e.id, e);
    });
    const list = [...byId.values()].sort((a, b) => b.s - a.s || a.time - b.time);
    const grew = LB.loaded && list.length > LB.lastCount;
    LB.entries = list; LB.loaded = true; LB.ok = true; LB.lastCount = list.length;
    if (S.view === 'results') { render(); if (grew) leafConfetti(24); }
  } catch (e) {
    LB.ok = false; LB.loaded = true;
    if (S.view === 'results') render();
  }
}
function startPolling() { if (LB.timer) return; pollResults(); LB.timer = setInterval(pollResults, 4000); }
function stopPolling() { clearInterval(LB.timer); LB.timer = null; }

document.addEventListener('click', (e) => {

    if (i % 3 === 0) d.innerHTML = '<span class="lbl">CO₂</span>';
    FX.appendChild(d); smogs.push({ d, x, y, sc });
    d.animate([{ opacity: 0 }, { opacity: .6 }], { duration: 700, delay: i * 90, fill: 'forwards' });
  }
  const m = document.createElement('div'); m.className = 'sk-hero';
  m.innerHTML = MACHINE_SVG + '<span class="say">Smoke Killer is <b>cleaning the air!</b></span>';
  m.style.left = mx + 'px'; m.style.top = my + 'px';
  FX.appendChild(m);
  m.animate([{ transform: 'translateY(520px) scale(.6)' }, { transform: 'translateY(-20px) scale(1.05)' }, { transform: 'translateY(0) scale(1)' }],
    { duration: 900, delay: 900, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'both' });
  m.querySelector('.say').animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 400, delay: 1700, fill: 'both' });
  const ix = mx + mw * .1, iy = my + mw * .6;
  smogs.forEach((s, i) => {
    s.d.animate([{ transform: `translate(0,0) scale(${s.sc})`, opacity: .6 }, { transform: `translate(${ix - s.x - 45}px, ${iy - s.y - 45}px) scale(.05)`, opacity: .15 }],
      { duration: 1300, delay: 2100 + i * 160, easing: 'cubic-bezier(.6,0,.9,.6)', fill: 'forwards' });
  });
  setTimeout(() => {
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('div');
      const leaf = i % 3 === 2, o2 = i % 4 === 0;
      if (leaf) { b.style.position = 'absolute'; b.innerHTML = LEAF_SVG(['#4FE08F', '#2F9E5B', '#7DBA3A'][i % 3]); }
      else { b.className = 'bub' + (o2 ? ' o2' : ''); if (o2) b.textContent = 'O₂'; else { const r = 10 + Math.random() * 18; b.style.width = b.style.height = r + 'px'; } }
      b.style.left = (mx + mw * .8) + 'px'; b.style.top = (my + 10) + 'px';
      FX.appendChild(b);
      const dx = -Math.random() * W * .7 + 60, dy = -(my + 40) - Math.random() * 60;
      b.animate([{ transform: 'translate(0,0) scale(.3) rotate(0deg)', opacity: 0 }, { opacity: 1, offset: .15 },
                 { transform: `translate(${dx}px, ${dy}px) scale(1.2) rotate(${Math.random() * 540 - 270}deg)`, opacity: 0 }],
        { duration: 2600 + Math.random() * 1400, delay: i * 70, easing: 'cubic-bezier(.2,.6,.4,1)', fill: 'forwards' });
    }
  }, 3600);
  setTimeout(() => {
    m.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-14px) scale(1.03)' }, { transform: 'translateY(560px) scale(.6)' }], { duration: 800, easing: 'ease-in', fill: 'forwards' });
  }, 6800);
  setTimeout(() => { FX.innerHTML = ''; surpriseBusy = false; }, 8000);
}
function leafConfetti(n = 36) {
  if (REDUCED || !FX || !FX.animate) return;
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'cf';
    c.innerHTML = i % 4 === 0 ? '<span class="bub o2" style="position:static;display:inline-block">O₂</span>' : LEAF_SVG(['#4FE08F', '#2F9E5B', '#7DBA3A', '#3FCF9A'][i % 4]);
    c.style.left = Math.random() * W + 'px';
    FX.appendChild(c);
    const a = c.animate([{ transform: 'translate(0,0) rotate(0deg)' }, { transform: `translate(${Math.random() * 160 - 80}px, ${H + 80}px) rotate(${Math.random() * 720 - 360}deg)` }],
      { duration: 2400 + Math.random() * 1600, delay: Math.random() * 600, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' });
    a.onfinish = () => c.remove();
  }
}
setTimeout(surprise, 3500);
setInterval(() => { if (!document.hidden) surprise(); }, 40000);

window.addEventListener('hashchange', () => { const v = location.hash === '#results' ? 'results' : (location.hash === '#presenter' ? 'inicio' : 'play'); if (v !== S.view) go(v); });
if (S.view === 'results') startPolling();
render();
</script>
